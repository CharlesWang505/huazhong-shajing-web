function drawToFull(){while(battle.hand.length<MAX_HAND){if(!battle.draw.length){reshuffle();if(!battle.draw.length)break;}battle.hand.push(battle.draw.pop());}var rank={red:0,orange:1,gold:1,blue:2};battle.hand=battle.hand.map(function(c,i){return {card:c,index:i};}).sort(function(a,b){return (rank[a.card.quality]??4)-(rank[b.card.quality]??4)||a.card.name.localeCompare(b.card.name,'zh-CN')||b.card.dmg-a.card.dmg||a.index-b.index;}).map(function(x){return x.card;});}
function reshuffle(){
 if(!battle.discard.length)return;
 battle.shuffles++;battle.draw=shuffle(battle.discard.splice(0));
 battle.logs.unshift('弃牌堆洗回抽牌堆（第 '+battle.shuffles+' 次）。');

  var dmg=50*battle.shuffles;dealDamage(dmg,'洗牌谋略',true);
 }
}

 if(i>=0){battle.selected.splice(i,1);save();play('select');renderBattle();return;}
 if(battle.selected.length>=MAX_SELECT){toast('每次至多选择 6 张牌。','red');play('error');return;}
